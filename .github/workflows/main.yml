on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v3
      - uses: pnpm/setup@v2
      - run: |          
          pnpm install
          pnpm run content
          pnpm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/
  deploy-site:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-site
    steps:
      - id: Deploy
        uses: actions/deploy-pages@v4
        
